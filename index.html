
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Mates - Guest Management</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" onload="this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"></noscript>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#8c2bee",
                        "background-dark": "#191022",
                        "surface-dark": "#241a30",
                        "surface-highlight": "#362348",
                        "border-dark": "#4d3267"
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        /* hide icons until the Material Symbols font is loaded to avoid showing their text fallback */
        html.material-symbols-loading .material-symbols-outlined { visibility: hidden; }
        html.material-symbols-loaded  .material-symbols-outlined { visibility: visible; }

        body {
            font-family: 'Spline Sans', sans-serif;
            background-color: #191022;
            color: white;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            /* ensure the symbol font is declared as fallback so it displays correctly once loaded */
            font-family: 'Material Symbols Outlined', 'Spline Sans', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #362348;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #4d3267;
        }
    </style>
    <script>
      // Add a loading class immediately to avoid showing text fallback for icon spans
      try { document.documentElement.classList.add('material-symbols-loading'); } catch(e){}

      // Wait for the Material Symbols font to be available, then toggle classes
      (function(){
        if (document.fonts && document.fonts.load) {
          document.fonts.load("1em 'Material Symbols Outlined'").then(function() {
            document.documentElement.classList.remove('material-symbols-loading');
            document.documentElement.classList.add('material-symbols-loaded');
          }).catch(function(){
            // fallback: remove loading class after timeout so icons become visible
            setTimeout(function(){ document.documentElement.classList.remove('material-symbols-loading'); }, 2500);
          });
        } else {
          // older browsers
          setTimeout(function(){ document.documentElement.classList.remove('material-symbols-loading'); }, 2500);
        }
      })();
    </script>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="antialiased overflow-x-hidden">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
